[package]
name = "dactile-server"
description = "Dactile in the browser: one person's server, and the gate that gives each person theirs"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
default-run = "dactile-server"

[dependencies]
dactile = { path = "../core" }
dactile-backend = { path = "../backend" }
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tower-http = { version = "0.6", features = ["fs"] }
yrs = "0.28"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
