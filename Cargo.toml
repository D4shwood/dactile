[package]
name = "dactile"
version = "0.2.0-beta.6"
edition = "2024"
description = "Dactile — Dynamic Stagewright: write stage plays with live tiyatro.cls macros"
repository = "https://github.com/D4shwood/dactile"
license = "GPL-3.0-or-later"
readme = "README.md"

[lib]
name = "dactile"
path = "src/lib.rs"

[[bin]]
name = "dactile"
path = "src/main.rs"
required-features = ["app"]

[dependencies]
anyhow = "1"
chrono = "0.4.45"
dirs = "7.0.0"
serde = { version = "1", features = ["derive"] }
spellbook = "0.4.2"
toml = "1"
unicode-width = "0.2.2"
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"], optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
ratatui = { version = "0.30.2", optional = true }
zip = { version = "9.2.1", default-features = false, features = ["deflate"] }
quick-xml = "0.42.0"
pdf-extract = "0.12.1"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"], optional = true }

[features]
default = ["app"]
# Everything beyond the play model: the terminal interface. The core alone
# (reading and writing plays) builds with `default-features = false`.
app = ["dep:arboard", "dep:clap", "dep:ratatui", "dep:rfd"]

# The Turkish dictionary is large: keep its loader fast in debug builds too.
[profile.dev.package.spellbook]
opt-level = 3
[profile.dev.package.hashbrown]
opt-level = 3
[profile.dev.package.foldhash]
opt-level = 3
