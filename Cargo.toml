[workspace]
members = ["core", "tui", "app/src-tauri"]
# The desktop app needs WebKitGTK and a built front end: plain `cargo`
# commands leave it out; `-p dactile-app` or `--workspace` take it in.
default-members = ["core", "tui"]
resolver = "3"

[workspace.package]
version = "0.2.0-beta.6"
edition = "2024"
repository = "https://github.com/D4shwood/dactile"
license = "GPL-3.0-or-later"

# The Turkish dictionary is large: keep its loader fast in debug builds too.
[profile.dev.package.spellbook]
opt-level = 3
[profile.dev.package.hashbrown]
opt-level = 3
[profile.dev.package.foldhash]
opt-level = 3
