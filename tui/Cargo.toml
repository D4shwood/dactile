[package]
name = "dactile-light"
description = "Dactile Light: write stage plays in a terminal, with the tiyatro class"
# Retired at 0.3.0-beta.2 and outside the workspace: build it from that tag
# (`git checkout v0.3.0-beta.2`, then `cargo install --path tui`).
version = "0.3.0-beta.2"
edition = "2024"
repository = "https://github.com/D4shwood/dactile"
license = "GPL-3.0-or-later"
readme = "../README.md"

[[bin]]
name = "dactile-light"
path = "src/main.rs"

[dependencies]
dactile = { path = "../core" }
anyhow = "1"
chrono = "0.4.45"
dirs = "7.0.0"
unicode-width = "0.2.2"
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.30.2"
regex = "1"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
