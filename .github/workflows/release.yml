name: Release

# Pushing a tag like v0.1.0 or v0.1.0-beta.1 builds the desktop app (an
# AppImage, and an archive for the AUR package) and Dactile Light's archive,
# and publishes them as a GitHub release; tags with a "-" become pre-releases.
# Run by hand (workflow_dispatch) it only builds them, as downloadable
# artifacts, without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # The tag, or "dev" for a run by hand.
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  light:
    # An older glibc, so the binary runs on older distributions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release --locked -p dactile-light
      - name: Package
        run: |
          name=dactile-light-${VERSION}-x86_64-linux
          mkdir "$name"
          cp target/release/dactile-light README.md README.tr.md LICENSE "$name"/
          cp -r tex examples "$name"/
          rm -rf "$name"/tex/test
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: light
          path: dactile-light-*.tar.gz

  app:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: app
      - run: cargo test -p dactile-app
      - run: npm run tauri build -- --bundles appimage
        working-directory: app
      - name: Package
        run: |
          cp target/release/bundle/appimage/*.AppImage "Dactile-${VERSION}-x86_64.AppImage"
          name=dactile-${VERSION}-x86_64-linux
          mkdir "$name"
          cp target/release/dactile app/linux/*.desktop LICENSE "$name"/
          cp app/src-tauri/icons/icon.png "$name"/
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            Dactile-*.AppImage
            dactile-v*.tar.gz
            dactile-dev-*.tar.gz

  publish:
    if: github.ref_type == 'tag'
    needs: [light, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          pre=""
          case "$VERSION" in *-*) pre="--prerelease" ;; esac
          gh release create "$VERSION" $pre --verify-tag \
            --title "$VERSION" --notes-file ../RELEASE_NOTES.md *
