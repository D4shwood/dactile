name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The core alone, as another frontend would use it.
      - run: cargo test --no-default-features --lib

  # The tiyatro class: the example play must compile in draft and final mode.
  tex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-dejavu-core
      - uses: TeX-Live/setup-texlive-action@v3
        with:
          packages: |
            scheme-basic
            fontspec
            geometry
            setspace
            tools
            lm
      - run: tex/test/run.sh
