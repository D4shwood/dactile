name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The core and Dactile Light; the app has a job of its own.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The core alone, as the desktop app uses it.
      - run: cargo test -p dactile

  # The desktop app: its front end built, then its Rust side checked and
  # tested against it.
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: app
      - run: npm run check
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: cargo clippy -p dactile-app --all-targets -- -D warnings
      - run: cargo test -p dactile-app

  # The tiyatro class: the example play must compile in draft and final mode.
  tex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-dejavu-core poppler-utils
      - uses: TeX-Live/setup-texlive-action@v3
        with:
          packages: |
            scheme-basic
            xetex
            fontspec
            geometry
            setspace
            tools
            lm
            xcolor
      - run: tex/test/run.sh
