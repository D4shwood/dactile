name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The core, Dactile Light, the backend and the web server; the app has
      # a job of its own.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The core alone, as the desktop app uses it.
      - run: cargo test -p dactile
      # What the browser runs: the core and the backend must build for it.
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo build -p dactile-wasm --target wasm32-unknown-unknown

  # The desktop app: its front end built, then its Rust side checked and
  # tested against it.
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # What the browser's build needs: the wasm32 target, and wasm-bindgen
      # of the version Cargo.lock has.
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --locked --version "$(cargo pkgid wasm-bindgen | sed 's/.*@//')"
      - run: npm ci
        working-directory: app
      - run: npm run check
        working-directory: app
      - run: npm run build
        working-directory: app
      # The same interface for the browser, over its stand-ins for Tauri and
      # with the text-only commands built into it (web-wasm).
      - run: npm run check:web
        working-directory: app
      - run: npm run build:web
        working-directory: app
      - run: cargo clippy -p dactile-app --all-targets -- -D warnings
      - run: cargo test -p dactile-app

  # The desktop on Windows, which opens a site's plays: the core, the
  # backend and the app, tested there. The server and the browser's build
  # are Linux's and the browser's.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: cargo clippy -p dactile -p dactile-backend -p dactile-app --all-targets -- -D warnings
      - run: cargo test -p dactile -p dactile-backend -p dactile-app

  # The tiyatro class: the example play must compile in draft and final mode.
  tex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-dejavu-core poppler-utils
      - uses: TeX-Live/setup-texlive-action@v3
        with:
          packages: |
            scheme-basic
            xetex
            fontspec
            geometry
            setspace
            tools
            lm
            xcolor
      - run: tex/test/run.sh
