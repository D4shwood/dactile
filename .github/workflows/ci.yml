name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The core alone, as the desktop app uses it.
      - run: cargo test -p dactile

  # The tiyatro class: the example play must compile in draft and final mode.
  tex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-dejavu-core poppler-utils
      - uses: TeX-Live/setup-texlive-action@v3
        with:
          packages: |
            scheme-basic
            xetex
            fontspec
            geometry
            setspace
            tools
            lm
            xcolor
      - run: tex/test/run.sh
