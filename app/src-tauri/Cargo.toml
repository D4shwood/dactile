[package]
name = "dactile-app"
description = "Dactile: a desktop app for writing stage plays"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "dactile"
path = "src/main.rs"
# The library it uses has the same name.
doc = false

[lib]
name = "dactile_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dactile = { path = "../../core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# The file picker through the desktop portal, as Dactile Light does it
# (tauri-plugin-dialog wants rfd's GTK side, which can't sit beside it).
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
